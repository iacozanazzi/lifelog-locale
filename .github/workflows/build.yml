name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Scarica sherpa-onnx (Apache-2.0)
        run: ./scripts/fetch-deps.sh

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Firma con la chiave nuova (rotazione, schema v3)
        env:
          NEW_KS_B64: ${{ secrets.LIFELOG_KEYSTORE_B64 }}
          NEW_KS_PASS: ${{ secrets.LIFELOG_KEYSTORE_PASS }}
        run: |
          # La chiave vecchia (app/lifelog.keystore) è pubblica. Se c'è la chiave nuova nei segreti del repo,
          # l'APK si firma con la "discendenza" vecchia → nuova: il telefono accetta l'aggiornamento senza perdere
          # dati, e da lì in poi rifiuta qualsiasi APK firmato solo con la chiave vecchia (rollback disattivato).
          if [ -z "$NEW_KS_B64" ] || [ -z "$NEW_KS_PASS" ]; then
            echo "Chiave nuova non impostata: resta la firma vecchia."; exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$NEW_KS_B64" | base64 -d > "$RUNNER_TEMP/new.jks"
          OLD=(--ks app/lifelog.keystore --ks-key-alias lifelog --ks-pass pass:lifelog-locale --key-pass pass:lifelog-locale)
          NEW=(--ks "$RUNNER_TEMP/new.jks" --ks-key-alias lifelog2 --ks-pass env:NEW_KS_PASS --key-pass env:NEW_KS_PASS)
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer "${OLD[@]}" --set-rollback false --set-shared-uid false --set-permission false --set-auth false \
            --new-signer "${NEW[@]}"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" sign "${OLD[@]}" --next-signer "${NEW[@]}" \
            --lineage "$RUNNER_TEMP/lineage.bin" --rotation-min-sdk-version 28 --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" | grep -E "Verified|Signer|lineage|rotation" || true
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/new.jks" "$RUNNER_TEMP/lineage.bin"

      - name: Anteprime delle schermate
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/lifelog-v${{ github.run_number }}.apk
          mkdir -p screens
          cp app/build/screens/*.png screens/ 2>/dev/null || true
          ls screens

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: |
            out/*.apk
            screens/*.png

      - name: Anteprime di un ramo di prova (pre-release "anteprime", sovrascritta ogni volta)
        if: github.ref != 'refs/heads/main' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screens/*.png >/dev/null 2>&1 || exit 0
          gh release delete anteprime --cleanup-tag -y 2>/dev/null || true
          sleep 3
          gh release create anteprime screens/*.png --prerelease --latest=false --target "${{ github.sha }}" \
            --title "Anteprime (ramo di prova)" --notes "Solo immagini delle schermate di un ramo non ancora unito. Non c'è niente da installare."

      - name: Pubblica come Release (download diretto dal telefono)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}
        run: |
          # Crea la release già pubblicata (niente bozza: pubblicare una bozza
          # dava errore 500 da GitHub), poi carica i file uno alla volta.
          for i in 1 2 3 4; do
            gh api "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
              -f name="Lifelog $TAG" -f body="APK da installare sul telefono. Istruzioni nel README." \
              -F draft=false -f make_latest=true && break
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          # GitHub a volte risponde 500 anche quando il file è arrivato:
          # dopo ogni tentativo controllo se c'è davvero.
          has() { gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$1"; }
          apk=$(basename out/*.apk)
          for i in 1 2 3 4; do gh release upload "$TAG" "out/$apk" --clobber || true; sleep 3; has "$apk" && break; done
          has "$apk"
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            for i in 1 2 3; do gh release upload "$TAG" "$f" --clobber || true; has "$(basename "$f")" && break; sleep 5; done
          done
