name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Scarica sherpa-onnx (Apache-2.0)
        run: ./scripts/fetch-deps.sh

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Anteprime delle schermate
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/lifelog-v${{ github.run_number }}.apk
          mkdir -p screens
          cp app/build/screens/*.png screens/ 2>/dev/null || true
          ls screens

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: |
            out/*.apk
            screens/*.png

      - name: Pubblica come Release (download diretto dal telefono)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prima l'APK da solo (crea la release), poi le anteprime una per volta:
          # caricarle tutte insieme in parallelo faceva fallire il passaggio.
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "Lifelog v${{ github.run_number }}" \
            --notes "APK da installare sul telefono. Istruzioni nel README." --latest
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            for i in 1 2 3; do gh release upload "v${{ github.run_number }}" "$f" --clobber && break; sleep 5; done
          done
