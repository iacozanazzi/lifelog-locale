name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Scarica sherpa-onnx (Apache-2.0)
        run: ./scripts/fetch-deps.sh

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Anteprime delle schermate
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/lifelog-v${{ github.run_number }}.apk
          mkdir -p screens
          cp app/build/screens/*.png screens/ 2>/dev/null || true
          ls screens

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: |
            out/*.apk
            screens/*.png

      - name: Anteprime di un ramo di prova (pre-release "anteprime", sovrascritta ogni volta)
        if: github.ref != 'refs/heads/main' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screens/*.png >/dev/null 2>&1 || exit 0
          gh release delete anteprime --cleanup-tag -y 2>/dev/null || true
          sleep 3
          gh release create anteprime screens/*.png --prerelease --latest=false --target "${{ github.sha }}" \
            --title "Anteprime (ramo di prova)" --notes "Solo immagini delle schermate di un ramo non ancora unito. Non c'è niente da installare."

      - name: Pubblica come Release (download diretto dal telefono)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}
        run: |
          # Crea la release già pubblicata (niente bozza: pubblicare una bozza
          # dava errore 500 da GitHub), poi carica i file uno alla volta.
          for i in 1 2 3 4; do
            gh api "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
              -f name="Lifelog $TAG" -f body="APK da installare sul telefono. Istruzioni nel README." \
              -F draft=false -f make_latest=true && break
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          # GitHub a volte risponde 500 anche quando il file è arrivato:
          # dopo ogni tentativo controllo se c'è davvero.
          has() { gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$1"; }
          apk=$(basename out/*.apk)
          for i in 1 2 3 4; do gh release upload "$TAG" "out/$apk" --clobber || true; sleep 3; has "$apk" && break; done
          has "$apk"
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            for i in 1 2 3; do gh release upload "$TAG" "$f" --clobber || true; has "$(basename "$f")" && break; sleep 5; done
          done
