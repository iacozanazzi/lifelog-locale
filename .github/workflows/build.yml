name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Scarica sherpa-onnx (Apache-2.0)
        run: ./scripts/fetch-deps.sh

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Anteprime delle schermate
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/lifelog-v${{ github.run_number }}.apk
          mkdir -p screens
          cp app/build/screens/*.png screens/ 2>/dev/null || true
          ls screens

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: |
            out/*.apk
            screens/*.png

      - name: Pubblica come Release (download diretto dal telefono)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}
        run: |
          # Crea la release già pubblicata (niente bozza: pubblicare una bozza
          # dava errore 500 da GitHub), poi carica i file uno alla volta.
          for i in 1 2 3 4; do
            gh api "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
              -f name="Lifelog $TAG" -f body="APK da installare sul telefono. Istruzioni nel README." \
              -F draft=false -f make_latest=true && break
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          ok=0
          for i in 1 2 3 4; do gh release upload "$TAG" out/*.apk --clobber && ok=1 && break; sleep 10; done
          [ "$ok" = 1 ] || exit 1
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            for i in 1 2 3; do gh release upload "$TAG" "$f" --clobber && break; sleep 5; done || true
          done
