name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Scarica sherpa-onnx (Apache-2.0)
        run: ./scripts/fetch-deps.sh

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/lifelog-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: out/*.apk

      - name: Pubblica come Release (download diretto dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lifelog v${{ github.run_number }}
          body: "APK da installare sul telefono. Istruzioni nel README."
          files: out/*.apk
          make_latest: true
